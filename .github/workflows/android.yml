name: Android build

on:
  push:
    branches: [ android-port ]
  pull_request:
  workflow_dispatch:

env:
  SDL_TAG: release-2.30.9
  API: 24

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools cmake
          pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build SDL2 for ${{ matrix.abi }}
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-$API \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl-build
          find sdl-build -name 'libSDL2.so'

      - name: Build libdxvk_d3d9.so
        run: |
          export SDL2_INCLUDE="$PWD/sdl-src/include"
          export SDL2_LIB_DIR="$(dirname "$(find "$PWD/sdl-build" -name libSDL2.so | head -1)")"
          ./android/build-android.sh ${{ matrix.abi }} $API

      - uses: actions/upload-artifact@v4
        with:
          name: libdxvk_d3d9-${{ matrix.abi }}
          path: build-android/${{ matrix.abi }}/lib/libdxvk_d3d9.so
          if-no-files-found: error
